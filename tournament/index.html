<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Arena — color-squad tournament</title>
<style>
  :root { --bg:#0c1016; --panel:#141a24; --line:#232c3a; --ink:#e8e4da; --dim:#9aa3b2;
          --a:#ff5d49; --b:#35c6b8; --amber:#f2b14e; --green:#8fe388; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:900px; margin:0 auto; padding:16px; }
  a { color:var(--amber); }
  header h1 { margin:8px 0 2px; font-size:32px; letter-spacing:.3px; }
  header .sub { color:var(--dim); margin:0 0 10px; font-size:14px; }
  nav { display:flex; gap:10px; margin:0 0 18px; flex-wrap:wrap; }
  nav a { text-decoration:none; background:var(--panel); border:1px solid var(--line);
          border-radius:8px; padding:8px 14px; font-size:14px; }
  nav a:hover { border-color:var(--amber); }
  h2 { font-size:20px; margin:22px 0 10px; }
  .tally-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
  .strat { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .strat .name { font-weight:700; font-size:16px; margin-bottom:6px; }
  .strat .wld { font-variant-numeric:tabular-nums; font-size:14px; }
  .strat .wld .w { color:var(--green); font-weight:700; }
  .strat .wld .l { color:var(--a); font-weight:700; }
  .strat .wld .d { color:var(--dim); font-weight:700; }
  .strat .bar { height:6px; background:#0a0d12; border-radius:3px; margin-top:8px; overflow:hidden; }
  .strat .bar i { display:block; height:100%; background:var(--amber); border-radius:3px; }
  .strat .pct { color:var(--dim); font-size:12px; margin-top:4px; }
  #tallyMeta { color:var(--dim); font-size:13px; margin:10px 0 0; }
  .match { background:var(--panel); border:1px solid var(--line); border-radius:12px;
           padding:10px 14px; margin-bottom:8px; display:flex; gap:10px; align-items:center;
           flex-wrap:wrap; }
  .match .when { color:var(--dim); font-size:12.5px; min-width:150px; }
  .match .versus { font-weight:600; font-size:15px; flex:1 1 220px; }
  .match .versus .winner { color:var(--green); }
  .match .score { font-variant-numeric:tabular-nums; font-weight:700; font-size:16px; }
  .match .seed { color:var(--dim); font-size:12px; }
  .match .rlink { font-size:13.5px; text-decoration:none; font-weight:600; }
  .match .norl { font-size:13px; color:#5b6372; font-style:italic; }
  .drawbadge { color:var(--dim); font-size:12px; border:1px solid var(--line);
               border-radius:6px; padding:2px 8px; }
  footer { color:var(--dim); font-size:12.5px; margin:26px 0 10px; }
  #err { color:var(--a); font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>&#9876; The Arena</h1>
    <p class="sub">Where the color-squads settle it &mdash; flag, wits, and a strict call budget. Fresh results roll in about every 45 seconds.</p>
    <nav>
      <a href="show.html">&#127914; the show</a>
      <a href="../tournament-demo.html">&#9654; watch one live</a>
      <a href="mosaic.html">&#9638; the mosaic</a>
      <a href="../">&#8962; hub</a>
    </nav>
  </header>

  <h2>Tally board</h2>
  <div class="tally-grid" id="tallyGrid"></div>
  <p id="tallyMeta"></p>

  <h2>Fresh from the pit</h2>
  <div id="matchList"></div>
  <p id="err"></p>

  <footer>Auto-refreshes every 30 seconds &middot; <span id="lastUpdated"></span></footer>
</div>

<script>
(function () {
'use strict';
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

/* PURE — also exercised by the node logic test in verify.sh. */
function tallyRows(rows) {
  var t = {};
  function ens(s) { if (!t[s]) t[s] = { w: 0, l: 0, d: 0 }; return t[s]; }
  var counted = 0;
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    if (!r || !r.a || !r.b) continue;
    counted++;
    if (r.winner === 'draw') { ens(r.a).d++; ens(r.b).d++; }
    else if (r.winner === 'B') { ens(r.b).w++; ens(r.a).l++; }
    else { ens(r.a).w++; ens(r.b).l++; }   // 'A' or anything unexpected defaults to A
  }
  return { byStrategy: t, counted: counted };
}

function parseJsonl(text) {
  var rows = [];
  var lines = text.split('\n');
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    try { rows.push(JSON.parse(line)); } catch (e) { /* skip malformed lines */ }
  }
  return rows;
}

function timeAgo(ts) {
  var dt = Date.now() - new Date(ts).getTime();
  if (isNaN(dt) || dt < 0) return 'just now';
  var m = Math.floor(dt / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  var h = Math.floor(m / 60);
  if (h < 24) return h + ' hr ago';
  return Math.floor(h / 24) + ' days ago';
}

function renderTally(rows) {
  var res = tallyRows(rows);
  var t = res.byStrategy;
  var names = Object.keys(t).sort(function (x, y) { return t[y].w - t[x].w || t[x].l - t[y].l; });
  var html = '';
  var maxW = 1;
  names.forEach(function (n) { if (t[n].w > maxW) maxW = t[n].w; });
  names.forEach(function (n) {
    var s = t[n], played = s.w + s.l + s.d;
    var pct = played ? Math.round(100 * s.w / played) : 0;
    html += '<div class="strat"><div class="name">' + esc(n) + '</div>' +
      '<div class="wld"><span class="w">' + s.w + 'W</span> · ' +
      '<span class="l">' + s.l + 'L</span> · ' +
      '<span class="d">' + s.d + 'D</span></div>' +
      '<div class="bar"><i style="width:' + Math.round(100 * s.w / maxW) + '%"></i></div>' +
      '<div class="pct">' + played + ' bouts · ' + pct + '% wins</div></div>';
  });
  $('tallyGrid').innerHTML = html || '<p style="color:var(--dim)">No bouts yet — the squads are still lacing up.</p>';
  var replays = rows.filter(function (r) { return r.replay; }).length;
  var last = rows.length ? rows[rows.length - 1].ts : null;
  $('tallyMeta').textContent = res.counted + ' bouts tallied · ' + replays +
    ' replays on file' + (last ? ' · last bout ' + timeAgo(last) : '');
}

function renderMatches(rows) {
  var html = '';
  for (var i = rows.length - 1; i >= 0; i--) {
    var r = rows[i];
    var when = r.ts ? new Date(r.ts).toLocaleString() : '—';
    var winName = r.winner === 'draw' ? null : (r.winner === 'B' ? r.b : r.a);
    var vs = esc(r.a) + ' <span style="color:var(--dim)">vs</span> ' + esc(r.b);
    var badge = winName
      ? '<span class="winner">&#9733; ' + esc(winName) + '</span>'
      : '<span class="drawbadge">draw — nobody blinks</span>';
    var link = r.replay
      ? '<a class="rlink" href="replay.html?r=' + encodeURIComponent(r.replay) + '">watch replay &rarr;</a>'
      : '<span class="norl">no replay yet</span>';
    html += '<div class="match"><span class="when">' + esc(when) + '</span>' +
      '<span class="versus">' + vs + ' &middot; ' + badge + '</span>' +
      '<span class="score">' + r.scoreA + ' – ' + r.scoreB + '</span>' +
      '<span class="seed">seed ' + esc(String(r.seed)) + '</span>' + link + '</div>';
  }
  $('matchList').innerHTML = html;
}

function refresh() {
  fetch('results.jsonl', { cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function (text) {
    var rows = parseJsonl(text);
    renderTally(rows);
    renderMatches(rows);
    $('lastUpdated').textContent = 'last checked ' + new Date().toLocaleTimeString();
    $('err').textContent = '';
  }).catch(function (err) {
    $('err').textContent = 'Could not fetch fresh results: ' + err.message + ' — showing last good board.';
  });
}

refresh();
setInterval(refresh, 30000);
})();
</script>
</body>
</html>
